name: "django_stickers_bot"

services:
  postgres:
    # Версия прибита: мажорную менять только с переносом данных
    image: postgres:18.6-alpine
    container_name: postgres_for_bot
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    restart: always
    volumes:
      # С 18-й версии образ ждёт монтирование в /var/lib/postgresql и сам
      # раскладывает данные в подкаталог с номером версии — как в datanar
      - ./for_docker/postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER}" ]
      interval: 1s
      timeout: 3s
      retries: 3

  django_stickers_bot:
    build: .
    container_name: django_stickers_bot
    env_file:
      - ./.env
    restart: always
    volumes:
      - ./for_docker/fixtures:/django_stickers_bot/fixtures
    tmpfs:
      - /tmp:size=256m
    healthcheck:
      test: [ "CMD", "python", "-m", "bot.bot.heartbeat" ]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
