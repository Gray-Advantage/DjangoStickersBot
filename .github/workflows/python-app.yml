name: DjangoStickersBot

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

env:
  BOT_API_TOKEN: "1234567890:test-token"
  BOT_ADMIN_USER_IDS: "1"
  DATABASE_NAME: database
  DATABASE_USER: bot_master
  DATABASE_PASSWORD: bot_master
  DATABASE_HOST: 127.0.0.1
  DATABASE_PORT: "5432"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements/test.txt
      - name: Run ruff check
        run: ruff check --show-fixes ./django_stickers_bot
      - name: Run ruff format check
        run: ruff format --check --diff ./django_stickers_bot

  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements/test.txt
      - name: Check code formatting with black
        run: black ./django_stickers_bot --check --diff

  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements/test.txt
      - name: Run flake8
        run: flake8 ./django_stickers_bot

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Run mypy
        run: mypy ./django_stickers_bot

  django-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: database
          POSTGRES_USER: bot_master
          POSTGRES_PASSWORD: bot_master
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Run Django tests
        working-directory: ./django_stickers_bot
        run: python manage.py test

  prod-deploy:
    if: github.ref == 'refs/heads/main'
    needs: [ruff, black, flake8, mypy, django-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          command_timeout: 30m
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            true
